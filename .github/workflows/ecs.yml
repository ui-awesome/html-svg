---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: ecs

permissions:
  contents: read

jobs:
  easy-coding-standard:
    uses: php-forge/actions/.github/workflows/ecs.yml@72def618dcf8a77705c26faa53e9f8b1dc1f53bb # v3.0.1
